[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ==================== PostgreSQL ====================
[program:postgresql]
command=/docker/init-db.sh
autostart=true
autorestart=false
startsecs=0
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.log

; Mantener postgres vivo despues del init
[program:postgresql-keepalive]
command=bash -c "sleep 8 && pg_ctlcluster $(pg_lsclusters -h | awk 'NR==1{print $1}') main status"
autostart=true
autorestart=unexpected
startretries=3
priority=15
stdout_logfile=/var/log/supervisor/pg-keepalive.log
stderr_logfile=/var/log/supervisor/pg-keepalive.log

; ==================== Backend FastAPI ====================
[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8001
directory=/app/backend
autostart=true
autorestart=true
startsecs=15
priority=20
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.log
environment=DATABASE_URL="postgresql://gaspredict:gaspredict2026@localhost:5432/gaspredict",PYTHONUNBUFFERED="1"

; ==================== Frontend Next.js ====================
[program:frontend]
command=node server.js
directory=/app/frontend
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend.log
environment=NODE_ENV="production",PORT="3001",HOSTNAME="0.0.0.0"
